services:
  cli-to-llm:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cli-to-llm
    ports:
      - "8080:8080"
    environment:
      CLI_TO_LLM_HOST: 0.0.0.0
      CLI_TO_LLM_PORT: "8080"
      CLI_TO_LLM_DEFAULT_MODEL: local-sim-001
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://127.0.0.1:8080/healthz', timeout=2).read()",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 3s

