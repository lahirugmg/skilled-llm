services:
  cli-to-llm:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cli-to-llm
    ports:
      - "8080:8080"
    environment:
      CLI_TO_LLM_HOST: 0.0.0.0
      CLI_TO_LLM_PORT: "8080"
      CLI_TO_LLM_DEFAULT_MODEL: local-sim-001
      CLI_TO_LLM_BACKEND: simulator
      GH_CONFIG_DIR: /root/.config/gh
      GH_TOKEN: ${GH_TOKEN:-}
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ${HOME}/.config/gh:/root/.config/gh
      - gh_extensions:/root/.local/share/gh
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://127.0.0.1:8080/healthz', timeout=2).read()",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 3s

  cli-to-llm-copilot:
    build:
      context: .
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
    container_name: cli-to-llm-copilot
    profiles: ["copilot"]
    platform: linux/amd64
    ports:
      - "8081:8080"
    environment:
      CLI_TO_LLM_HOST: 0.0.0.0
      CLI_TO_LLM_PORT: "8080"
      CLI_TO_LLM_DEFAULT_MODEL: copilot-cli
      CLI_TO_LLM_BACKEND: copilot-cli
      GH_CONFIG_DIR: /root/.config/gh
      GH_TOKEN: ${GH_TOKEN:-}
    volumes:
      - ${HOME}/.config/gh:/root/.config/gh
      - gh_extensions_copilot:/root/.local/share/gh
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://127.0.0.1:8080/healthz', timeout=2).read()",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 3s

  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"      # S3 API
      - "9001:9001"      # MinIO Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set minio http://minio:9000 minioadmin minioadmin;
      mc mb minio/llm-wiki --ignore-existing;
      mc mb minio/ballerina-context --ignore-existing;
      mc anonymous set download minio/llm-wiki;
      mc anonymous set download minio/ballerina-context;
      echo 'MinIO buckets initialized';
      "

volumes:
  gh_extensions:
  gh_extensions_copilot:
  minio_data:

