[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cli-to-llm"
version = "0.1.0"
description = "Local Dockerized simulator for Copilot CLI and Claude CLI style interactions."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "minio>=7.2.0",
    "python-multipart>=0.0.6",
]

[project.scripts]
cli-to-llm = "cli_to_llm.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

